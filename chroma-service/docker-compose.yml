
services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: cloud-attack-chroma

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - ./chroma_data:/chroma/chroma

    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"

    command: >
      run --host 0.0.0.0
      --port 8000
      --path /chroma/chroma

    restart: unless-stopped
